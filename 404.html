<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>페이지를 찾을 수 없습니다 | 비즈니스 메이커</title>
<link rel="icon" href="/assets/symbol.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --navy:#0E1B33; --blue:#2B5BE3; --paper:#F7F8FB;
    --line:#E3E7EF; --ink:#1A2233; --ink-soft:#5A6478; --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
      'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px; line-height:1.6;
  }
  .box{ width:100%; max-width:520px; text-align:center }
  .code{ font-size:.82rem; font-weight:700; letter-spacing:.14em;
    color:var(--blue); margin-bottom:14px }
  h1{ font-size:1.5rem; font-weight:800; color:var(--navy); margin-bottom:12px }
  p{ color:var(--ink-soft); font-size:.98rem; margin-bottom:28px }
  .home{ display:inline-block; background:var(--navy); color:var(--white);
    font-weight:700; font-size:.95rem; text-decoration:none;
    padding:13px 26px; border-radius:10px }
  .home:hover{ background:#16274A }
  .links{ margin-top:34px; padding-top:24px; border-top:1px solid var(--line) }
  .links .label{ font-size:.8rem; color:var(--ink-soft); margin-bottom:14px }
  .links a{ display:block; color:var(--navy); text-decoration:none;
    font-size:.95rem; font-weight:600; padding:9px 0 }
  .links a:hover{ color:var(--blue); text-decoration:underline }
</style>
</head>
<body>
  <main class="box">
    <div class="code">404 · NOT FOUND</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>아래에서 필요한 정보를 찾아보세요.</p>
    <a class="home" href="/">홈으로 돌아가기</a>
    <nav class="links">
      <div class="label">정책자금 안내</div>
      <a href="/sojingong">소상공인 정책자금 (소진공)</a>
      <a href="/jungjingong">중소기업 정책자금 (중진공)</a>
      <a href="/bojeung">보증서 대출 (신보·기보·재단)</a>
      <a href="/certification">기업인증·연구소·ISO</a>
    </nav>
  </main>
</body>
</html>
