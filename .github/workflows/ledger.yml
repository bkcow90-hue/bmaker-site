# 실행 사례 원장 자동 반영 — 구글시트(웹 게시 CSV) → 사이트
# 매시 17분에 시트를 읽고, 내용이 바뀐 경우에만 빌드·커밋한다. 푸시되면 Cloudflare가 자동 배포한다.
# 시트 연결: data/ledger-source.url 에 게시 CSV 주소 한 줄. 없으면 저장소의 data/cases.source.csv 만 사용.
name: ledger
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '7 21 * * *'   # 매일 06:07 KST — 접수 배지 날짜 재계산
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/ledger-source.url', 'data/funds-source.url', 'data/jaedan-source.url']
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 시트 게시본 가져오기
        id: fetch
        run: |
          if [ ! -f data/ledger-source.url ]; then echo "changed=skip" >> "$GITHUB_OUTPUT"; exit 0; fi
          URL=$(tr -d ' \r\n' < data/ledger-source.url)
          curl -fsSL "$URL" -o /tmp/sheet.csv
          sed -i 's/\r$//' /tmp/sheet.csv
          printf '\xEF\xBB\xBF' | cat - /tmp/sheet.csv > /tmp/sheet.bom.csv 2>/dev/null || cp /tmp/sheet.csv /tmp/sheet.bom.csv
          head -c 3 data/cases.source.csv | od -An -tx1 | grep -qi 'ef bb bf' && CUR=data/cases.source.csv || CUR=data/cases.source.csv
          CH=no
          if ! cmp -s <(sed 's/^\xEF\xBB\xBF//' /tmp/sheet.csv) <(sed 's/^\xEF\xBB\xBF//' data/cases.source.csv); then
            cp /tmp/sheet.bom.csv data/cases.source.csv; CH=yes
          fi
          if [ -f data/funds-source.url ]; then
            FURL=$(tr -d ' \r\n' < data/funds-source.url)
            curl -fsSL "$FURL" -o /tmp/funds.csv && sed -i 's/\r$//' /tmp/funds.csv
            printf '\xEF\xBB\xBF' | cat - /tmp/funds.csv > /tmp/funds.bom.csv 2>/dev/null || cp /tmp/funds.csv /tmp/funds.bom.csv
            if ! cmp -s <(sed 's/^\xEF\xBB\xBF//' /tmp/funds.csv) <(sed 's/^\xEF\xBB\xBF//' data/funds.source.csv); then
              cp /tmp/funds.bom.csv data/funds.source.csv; CH=yes
            fi
          fi
          if [ -f data/jaedan-source.url ]; then
            JURL=$(tr -d ' \r\n' < data/jaedan-source.url)
            curl -fsSL "$JURL" -o /tmp/jaedan.csv && sed -i 's/\r$//' /tmp/jaedan.csv
            printf '\xEF\xBB\xBF' | cat - /tmp/jaedan.csv > /tmp/jaedan.bom.csv 2>/dev/null || cp /tmp/jaedan.csv /tmp/jaedan.bom.csv
            if ! cmp -s <(sed 's/^\xEF\xBB\xBF//' /tmp/jaedan.csv) <(sed 's/^\xEF\xBB\xBF//' data/jaedan.source.csv); then
              cp /tmp/jaedan.bom.csv data/jaedan.source.csv; CH=yes
            fi
          fi
          if [ "${{ github.event.schedule }}" = "7 21 * * *" ]; then CH=yes; fi
          echo "changed=$CH" >> "$GITHUB_OUTPUT"
      - name: 빌드
        id: build
        if: steps.fetch.outputs.changed == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          pip -q install openpyxl pillow pytest
          set +e
          OUT=$(python tools/build_cases.py 2>&1 && python tools/build_funds.py 2>&1 && python tools/build_jaedan.py 2>&1 && python tools/build_gaein.py 2>&1 && python tools/build_consulting.py 2>&1 && python tools/build_jungjin.py 2>&1); RC=$?
          set -e
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            printf 'FAIL\n%s\n' "$OUT" > data/ledger-status.txt
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            set +e
            POUT=$(python -m pytest -q 2>&1); PRC=$?
            set -e
            echo "$POUT"
            if [ $PRC -ne 0 ]; then
              # 소스 2개·상태 파일만 남기고 수정분 전부 복원 (자금 페이지는 시트 행이 늘면 파일명도 늘어 고정 목록으로는 구멍이 생긴다)
              git ls-files -m | grep -v -E '^data/(cases|funds|jaedan)\.source\.csv$|^data/ledger-status\.txt$' | xargs -r git checkout -- || true
              # 새로 생성된 미추적 자금 페이지 제거 — 신규 자금이 테스트 실패와 함께 배포되는 것도 막는다
              git clean -f ':(glob)*.html' || true
              printf 'FAIL\n%s\n[pytest 실패]\n%s\n' "$OUT" "$POUT" > data/ledger-status.txt
              echo "ok=no" >> "$GITHUB_OUTPUT"
            else
              printf 'OK\n%s\n' "$OUT" > data/ledger-status.txt
              echo "ok=yes" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: 커밋·푸시 (변경 있을 때만)
        id: commit
        if: steps.fetch.outputs.changed == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add -A || true
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          if [ "${{ steps.build.outputs.ok }}" = "yes" ]; then
            git commit -m "chore(cases): 원장 자동 갱신 (구글시트)"
          else
            git commit -m "chore(cases): 원장 갱신 실패 기록 — bmaker.kr/data/ledger-status.txt 확인"
          fi
          git push
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
      - name: IndexNow 핑 (봇 커밋의 변경 페이지)
        if: steps.commit.outputs.pushed == 'yes' && steps.build.outputs.ok == 'yes'
        run: |
          KEYFILE=$(ls | grep -E '^[0-9a-f]{64}\.txt$' | head -1) || true
          [ -z "$KEYFILE" ] && { echo "키 파일 없음 — 핑 생략"; exit 0; }
          KEY=$(tr -d ' \r\n' < "$KEYFILE")
          FILES=$(git diff --name-only HEAD~1 -- '*.html' | grep -v '/' | grep -v '^404\.html$' || true)
          URLS=$(for f in $FILES; do if [ "$f" = "index.html" ]; then echo "https://bmaker.kr/"; else echo "https://bmaker.kr/${f%.html}"; fi; done | sort -u)
          [ -z "$URLS" ] && { echo "핑할 URL 없음"; exit 0; }
          LIST=$(echo "$URLS" | sed 's/.*/"&"/' | paste -sd, -)
          echo "IndexNow 핑 $(echo "$URLS" | wc -l)건:"; echo "$URLS"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"bmaker.kr\",\"key\":\"$KEY\",\"keyLocation\":\"https://bmaker.kr/$KEYFILE\",\"urlList\":[$LIST]}" \
            || echo "IndexNow 핑 실패 — 무시 (다음 갱신 때 자연 재시도)"
      - name: 실패 시 액션도 실패로
        if: steps.build.outputs.ok == 'no'
        run: exit 1
