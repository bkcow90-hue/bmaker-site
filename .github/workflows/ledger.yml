# 실행 사례 원장 자동 반영 — 구글시트(웹 게시 CSV) → 사이트
# 매시 17분에 시트를 읽고, 내용이 바뀐 경우에만 빌드·커밋한다. 푸시되면 Cloudflare가 자동 배포한다.
# 시트 연결: data/ledger-source.url 에 게시 CSV 주소 한 줄. 없으면 저장소의 data/cases.source.csv 만 사용.
name: ledger
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '7 21 * * *'   # 매일 06:07 KST — 접수 배지 날짜 재계산
  workflow_dispatch:
    inputs:
      force:
        # 기본값 true = 기존 수동 실행 동작(시트가 그대로여도 강제 재빌드).
        # n8n 매시 호출(2026-10-01~)은 force=false 로 보내 시트가 바뀐 경우에만 빌드한다 — GitHub 예약 실행이
        # 지연·생략돼(7일간 168회 중 42회) 정각 호출을 n8n 이 맡고, 예약 cron 은 안전망으로 남긴다.
        description: '시트가 그대로여도 빌드'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['data/ledger-source.url', 'data/funds-source.url', 'data/jaedan-source.url']
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 체크아웃이면 tools/builddate.py 의 data_date() 가 소스 파일의 마지막 커밋을
          # 못 찾아 '오늘' 로 떨어진다 — 시트가 안 바뀐 날에도 기준일이 매일 올라가고,
          # pr-check(fetch-depth 0)는 진짜 데이터 날짜를 계산하므로 churn 으로 잡힌다.
          fetch-depth: 0
      - name: 승인된 원본 가져오기
        id: fetch
        env:
          # 승인 전 미설정. CRM 원본은 공개 검수된 사례만. 기존 원장은 보존한다.
          BMAKER_CRM_LEDGER_URL: ${{ vars.BMAKER_CRM_LEDGER_URL }}
          LEDGER_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'false' }}
          LEDGER_DAILY: ${{ github.event.schedule == '7 21 * * *' }}
        run: python tools/sync_ledger.py fetch
      - name: 빌드
        id: build
        if: steps.fetch.outputs.changed == 'yes' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'false')
        run: |
          pip -q install openpyxl pillow pytest
          set +e
          OUT=$(python tools/build_cases.py 2>&1 && python tools/build_funds.py 2>&1 && python tools/build_jaedan.py 2>&1 && python tools/build_region.py 2>&1 && python tools/build_gaein.py 2>&1 && python tools/build_consulting.py 2>&1 && python tools/build_jungjin.py 2>&1 && python tools/build_editorial.py 2>&1 && python tools/build_education.py 2>&1 && python tools/build_hubs.py 2>&1 && python tools/build_blog.py 2>&1 && python tools/build_lastmod.py 2>&1); RC=$?
          set -e
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "failure_stage=build" >> "$GITHUB_OUTPUT"
          else
            set +e
            POUT=$(python -m pytest -q 2>&1); PRC=$?
            set -e
            echo "$POUT"
            if [ $PRC -ne 0 ]; then
              echo "ok=no" >> "$GITHUB_OUTPUT"
              echo "failure_stage=tests" >> "$GITHUB_OUTPUT"
            else
              python tools/sync_ledger.py success
              echo "ok=yes" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: 실패 시 마지막 정상 원장 보존
        if: failure() || steps.build.outputs.ok == 'no'
        env:
          LEDGER_FAILURE_STAGE: ${{ steps.fetch.outcome == 'failure' && 'fetch' || steps.build.outputs.failure_stage || 'workflow' }}
        run: python tools/sync_ledger.py failure
      - name: 커밋·푸시 (변경 있을 때만)
        id: commit
        if: always() && (steps.fetch.outputs.changed == 'yes' || steps.fetch.outcome == 'failure' || steps.build.outcome == 'failure')
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          if [ "${{ steps.build.outputs.ok }}" = "yes" ]; then
            git commit -m "chore(cases): 원장 자동 갱신 (승인 원본)"
          else
            git commit -m "chore(cases): 원장 갱신 실패 기록 — bmaker.kr/data/ledger-status.txt 확인"
          fi
          git push
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
      - name: IndexNow 핑 (봇 커밋의 변경 페이지)
        if: steps.commit.outputs.pushed == 'yes' && steps.build.outputs.ok == 'yes'
        run: |
          KEYFILE=$(ls | grep -E '^[0-9a-f]{64}\.txt$' | head -1) || true
          [ -z "$KEYFILE" ] && { echo "키 파일 없음 — 핑 생략"; exit 0; }
          KEY=$(tr -d ' \r\n' < "$KEYFILE")
          FILES=$(git diff --name-only HEAD~1 -- '*.html' | grep -v '/' | grep -v '^404\.html$' || true)
          URLS=$(for f in $FILES; do if [ "$f" = "index.html" ]; then echo "https://bmaker.kr/"; else echo "https://bmaker.kr/${f%.html}"; fi; done | sort -u)
          [ -z "$URLS" ] && { echo "핑할 URL 없음"; exit 0; }
          LIST=$(echo "$URLS" | sed 's/.*/"&"/' | paste -sd, -)
          echo "IndexNow 핑 $(echo "$URLS" | wc -l)건:"; echo "$URLS"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"bmaker.kr\",\"key\":\"$KEY\",\"keyLocation\":\"https://bmaker.kr/$KEYFILE\",\"urlList\":[$LIST]}" \
            || echo "IndexNow 핑 실패 — 무시 (다음 갱신 때 자연 재시도)"
      - name: 실패 시 액션도 실패로
        if: always() && (steps.fetch.outcome == 'failure' || steps.build.outcome == 'failure' || steps.build.outputs.ok == 'no')
        run: exit 1
