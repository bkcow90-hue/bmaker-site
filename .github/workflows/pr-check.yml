# PR·main 푸시 검사 — 브라우저 동작 테스트까지 여기서 돌린다.
# ledger.yml(매시 원장 갱신)은 건드리지 않는다: 그 잡은 가볍게 유지하고, Chromium 은 이 워크플로에서만 띄운다.
# 빌더 체인 churn 검사는 이 잡이 녹색으로 확인된 뒤 별도 커밋으로 추가한다.
name: pr-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true
env:
  # pip 설치와 캐시 키가 같은 값을 쓰도록 한 곳에서 고정한다 (올릴 때 여기만 바꾼다)
  PLAYWRIGHT_VERSION: '1.59.0'
jobs:
  test:
    # 런너를 고정한다. 2026-10-19 부터 ubuntu-latest 가 Ubuntu 26 으로 넘어가는데,
    # playwright 1.59 의 --with-deps 가 새 배포판 패키지를 못 받으면 이 잡이 깨진다.
    # 런너 업그레이드는 playwright 버전을 올릴 때 같이 한다(그때 env 와 함께 수정).
    runs-on: ubuntu-24.04
    # ledger 봇이 main 에 올리는 원장 갱신 커밋으로는 돌리지 않는다. PR 이벤트는 항상 돌린다.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # churn 검사가 '산출물을 마지막으로 재생성한 커밋' 을 찾아야 하므로 전체 이력이 필요하다
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip -q install openpyxl pillow pytest playwright==${{ env.PLAYWRIGHT_VERSION }}
      - name: Chromium 캐시
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Chromium 설치
        run: python -m playwright install --with-deps chromium
      - name: 브라우저 동작 테스트 (고정바 노출 규칙 — 로그에 이름별로, 실행 요약에 표로)
        env:
          REQUIRE_BROWSER: '1'
          # 요약을 한국어로 쓰므로 러너 로케일에 맡기지 않고 못박는다
          PYTHONIOENCODING: 'utf-8'
        # 파일이 없는 브랜치(예: 아직 병합되지 않은 시점의 main)에서는 건너뛴다 —
        # 뒤의 전체 pytest 가 다시 검사하므로 게이트에 구멍이 생기지는 않는다.
        run: |
          if [ ! -f tests/test_sticky_cta.py ]; then
            echo "tests/test_sticky_cta.py 없음 — 전체 pytest 로만 검사"
            exit 0
          fi
          set +e
          python -m pytest -v --junit-xml="$RUNNER_TEMP/sticky.xml" tests/test_sticky_cta.py
          RC=$?
          set -e
          # 실패해도 요약은 쓰고 나서 원래 종료코드로 끝낸다 (로그를 열지 않아도 보이게)
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          tmp = os.environ['RUNNER_TEMP']
          rows, failed, skipped = [], 0, 0
          for case in ET.parse(os.path.join(tmp, 'sticky.xml')).getroot().iter('testcase'):
              kinds = {child.tag for child in case}
              if kinds & {'failure', 'error'}:
                  mark, failed = '❌ FAIL', failed + 1
              elif 'skipped' in kinds:
                  mark, skipped = '⚠️ SKIP', skipped + 1
              else:
                  mark = '✅ PASS'
              rows.append(f"| `{case.get('name')}` | {mark} | {float(case.get('time') or 0):.2f}s |")
          with open(os.path.join(tmp, 'sticky-skipped.txt'), 'w') as f:
              f.write(str(skipped))
          print('## 고정바 노출 규칙 — 브라우저 동작 테스트')
          print()
          print('Chromium · 390×844 · `REQUIRE_BROWSER=1`')
          print()
          print('| 통과 | 실패 | skip | 합계 |')
          print('| --: | --: | --: | --: |')
          print(f'| {len(rows) - failed - skipped} | {failed} | {skipped} | {len(rows)} |')
          print()
          print('| 테스트 | 결과 | 소요 |')
          print('| --- | :-: | --: |')
          for row in rows:
              print(row)
          if skipped:
              print()
              print('> ⚠️ `REQUIRE_BROWSER=1` 환경에서는 사유와 무관하게 skip 자체가 오류입니다.')
          PY
          # pytest 는 skip 에도 0 을 돌려준다 — 그래서 종료코드만 보면 구멍이 생긴다
          SKIPPED=$(cat "$RUNNER_TEMP/sticky-skipped.txt")
          if [ "$SKIPPED" != "0" ]; then
            echo "::error::브라우저 테스트 $SKIPPED 건이 skip 됐습니다 (REQUIRE_BROWSER=1 에서는 오류)"
            exit 1
          fi
          exit $RC
      - name: pytest — REQUIRE_BROWSER=1 이면 브라우저 테스트가 skip 되지 못한다
        env:
          REQUIRE_BROWSER: '1'
          PYTHONIOENCODING: 'utf-8'
        # 전체 스위트도 skip 을 오류로 본다. 이 환경에서 skip 은 '검사하지 못했다' 는 뜻인데,
        # pytest 는 skip 에 종료코드 0 을 돌려주므로 초록으로 보인다(실제로 브라우저 검사 3건이
        # 조용히 빠진 적이 있다). junit 을 파싱해 건수를 요약에 남기고, skip 이 있으면 실패시킨다.
        run: |
          set +e
          python -m pytest -q --junit-xml="$RUNNER_TEMP/all.xml"
          RC=$?
          set -e
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          tmp = os.environ['RUNNER_TEMP']
          total = failed = skipped = 0
          names = []
          for case in ET.parse(os.path.join(tmp, 'all.xml')).getroot().iter('testcase'):
              total += 1
              kinds = {child.tag for child in case}
              if kinds & {'failure', 'error'}:
                  failed += 1
              elif 'skipped' in kinds:
                  skipped += 1
                  names.append(f"{case.get('classname')}::{case.get('name')}")
          with open(os.path.join(tmp, 'all-skipped.txt'), 'w') as f:
              f.write(str(skipped))
          print('## 전체 pytest')
          print()
          print('| 통과 | 실패 | skip | 합계 |')
          print('| --: | --: | --: | --: |')
          print(f'| {total - failed - skipped} | {failed} | {skipped} | {total} |')
          if names:
              print()
              print('skip 된 검사:')
              print()
              for n in names:
                  print(f'- `{n}`')
              print()
              print('> ⚠️ `REQUIRE_BROWSER=1` 환경에서는 사유와 무관하게 skip 자체가 오류입니다.')
          PY
          SKIPPED=$(cat "$RUNNER_TEMP/all-skipped.txt")
          if [ "$SKIPPED" != "0" ]; then
            echo "::error::pytest 에서 $SKIPPED 건이 skip 됐습니다 (REQUIRE_BROWSER=1 에서는 오류)"
            exit 1
          fi
          exit $RC
      - name: node 테스트
        run: node tests/test_conversion.mjs && node tests/test_analytics.mjs
      # 커밋된 산출물이 곧 1회차 기준이므로, 체인을 한 번만 돌려 git status 로 판정하면
      # "커밋 전에 체인을 돌렸는가" 와 "체인이 결정적인가" 를 한 번에 본다.
      # 입력은 커밋된 소스뿐이다 — 빌더에는 네트워크 호출이 없고(시트 fetch 는 ledger.yml 의
      # curl 단계이지 빌더가 아니다) openpyxl·PIL 은 저장소 파일만 읽는다. 그래서 시트가
      # 앞서가고 ledger 가 아직 안 돈 시점에도 이 검사는 흔들리지 않는다.
      # 첫 주는 경고만 — push·PR 실행에서 연속 5회 churn 0 이 확인되면 blocking 으로 바꾼다.
      - name: 빌더 체인 churn 검사 (첫 주는 경고만)
        continue-on-error: true
        env:
          PYTHONIOENCODING: 'utf-8'
        run: |
          set -e
          # 대상 커밋 — PR 은 머지 커밋이 아니라 head 커밋을 본다(머지 커밋 시각은 이벤트 시각이라 늘 오늘).
          TARGET="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          # 기준일은 그 커밋에서 '산출물을 마지막으로 재생성한 커밋' 의 KST 날짜다.
          # 대상 커밋 자체의 날짜를 쓰면, 산출물을 건드리지 않은 커밋(워크플로 수정 등)이 자정을
          # 넘겨 올라올 때마다 날짜 스탬프만으로 churn 이 잡혀 오탐이 된다(2026-09-19 실측 7개).
          STAMP_SHA=$(git log -1 --format=%H "$TARGET" -- data/page-updated.json cases.html)
          if [ -z "$STAMP_SHA" ]; then
            echo "산출물을 재생성한 커밋을 찾지 못했습니다 (fetch-depth 확인)"; exit 1
          fi
          BUILD_DATE=$(git log -1 --format=%cI "$STAMP_SHA" | python -c "import sys, datetime; print(datetime.datetime.fromisoformat(sys.stdin.read().strip()).astimezone(datetime.timezone(datetime.timedelta(hours=9))).date().isoformat())")
          export BUILD_DATE
          echo "대상 커밋 ${TARGET:0:7} · 산출물 갱신 커밋 ${STAMP_SHA:0:7} · BUILD_DATE=$BUILD_DATE"
          python tools/build_cases.py
          python tools/build_funds.py
          python tools/build_jaedan.py
          python tools/build_gaein.py
          python tools/build_consulting.py
          python tools/build_jungjin.py
          python tools/build_editorial.py
          python tools/build_education.py
          python tools/build_hubs.py
          python tools/build_lastmod.py
          # 바이너리 제외 목록 — 지금은 비어 있다. 빌더는 이미지를 만들지 않고 PIL 로 크기만
          # 읽으므로 체인의 산출물은 전부 텍스트다(html·xml·txt·json·csv). pillow·libwebp
          # 버전차로 바이트가 흔들리는 바이너리가 생기면 여기에 경로와 사유를 적어 제외한다.
          EXCLUDE=''
          CHANGED=$(git status --porcelain -- . $EXCLUDE)
          if [ -z "$CHANGED" ]; then
            echo "churn 0 — 커밋된 산출물이 체인 1회 실행 결과와 같다"
            printf '## 빌더 체인 churn 검사\n\n✅ churn 0 — 커밋된 산출물이 체인 1회 실행 결과와 같습니다. (기준일 %s)\n' "$BUILD_DATE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$CHANGED"
          {
            printf '## 빌더 체인 churn 검사\n\n'
            printf '⚠️ 변경된 산출물 %s개 (기준일 %s) — 커밋 전에 체인을 돌렸는지, 체인이 결정적인지 확인이 필요합니다.\n\n' "$(printf '%s\n' "$CHANGED" | wc -l | tr -d ' ')" "$BUILD_DATE"
            printf '```\n%s\n```\n\n' "$CHANGED"
            printf '### 텍스트 산출물 diff 상위 20줄\n\n```diff\n'
            git diff -U0 -- '*.html' '*.xml' '*.txt' '*.json' '*.csv' \
              | grep -E '^[-+][^-+]' | head -20 || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          # 텍스트 산출물은 반드시 0 이어야 한다 (바이너리는 위 EXCLUDE 에서 걸러진다)
          exit 1
