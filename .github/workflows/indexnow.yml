# IndexNow — 페이지가 main에 푸시되면 바뀐 URL을 빙·네이버 등 참여 엔진에 즉시 통보한다.
# 수동 실행(workflow_dispatch)은 sitemap 전체 URL을 일괄 핑한다(최초 시드·대량 갱신용).
name: indexnow
on:
  push:
    branches: [main]
    paths: ['**.html']
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: URL 수집·핑
        run: |
          KEYFILE=$(ls | grep -E '^[0-9a-f]{64}\.txt$' | head -1)
          [ -z "$KEYFILE" ] && { echo "키 파일 없음"; exit 1; }
          KEY=$(tr -d ' \r\n' < "$KEYFILE")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g')
          else
            FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" -- '*.html' 2>/dev/null || git diff --name-only HEAD~1 -- '*.html')
            FILES=$(echo "$FILES" | grep -v '^$' || true)
            # 바뀐 HTML 을 정본 URL 로 바꾼다. 하위 디렉터리도 그대로 둔다
            # (industry/eumsikjeom.html → https://bmaker.kr/industry/eumsikjeom).
            CAND=$(for f in $FILES; do if [ "$f" = "index.html" ]; then echo "https://bmaker.kr/"; else echo "https://bmaker.kr/${f%.html}"; fi; done)
            # 제출 대상은 sitemap.xml 에 실린 URL 로만 한정한다 — 색인 대상이 아닌 페이지
            # (404 등 sitemap 에 없는 것)를 따로 거르지 않아도 되고, 루트·하위 구분이 사라진다.
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | sort -u > sitemap-urls.txt
            URLS=$(echo "$CAND" | sort -u | grep -Fxf sitemap-urls.txt || true)
            rm -f sitemap-urls.txt
          fi
          URLS=$(echo "$URLS" | grep -v '^$' | sort -u)
          [ -z "$URLS" ] && { echo "핑할 URL 없음"; exit 0; }
          COUNT=$(echo "$URLS" | wc -l)
          LIST=$(echo "$URLS" | sed 's/.*/"&"/' | paste -sd, -)
          echo "IndexNow 핑 $COUNT건:"; echo "$URLS"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"bmaker.kr\",\"key\":\"$KEY\",\"keyLocation\":\"https://bmaker.kr/$KEYFILE\",\"urlList\":[$LIST]}"
